# Mises à jour automatiques, groupées et hebdomadaires pour économiser les minutes de CI.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      go-deps:
        patterns: ["*"]
    ignore:
      # ccxt FIGÉ en 4.5.78 (cf. go.mod) : à partir de 4.5.79, OKX refuse toute
      # requête authentifiée (en-tête OK-ACCESS-TIMESTAMP mal sérialisé, code 50112).
      # Ne remonter qu'à la main, après correction en amont et revérification de l'auth.
      - dependency-name: github.com/ccxt/ccxt/go/v4
      # Figés avec ccxt pour la même raison de compatibilité.
      - dependency-name: github.com/NethermindEth/juno
      - dependency-name: github.com/elliottech/lighter-go

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
